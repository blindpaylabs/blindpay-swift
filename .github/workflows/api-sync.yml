name: API Sync

on:
  repository_dispatch:
    types: [api-sync]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    name: Sync SDK with API changes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch spec-current.json from api-sync-data
        run: |
          git fetch origin api-sync-data
          git show origin/api-sync-data:.api-sync/spec-current.json > .api-sync/spec-current.json

      - name: Check for existing api-sync PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number // empty')
          echo "existing_pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create or checkout api-sync branch
        run: |
          git fetch origin api-sync 2>/dev/null || true
          if git rev-parse --verify origin/api-sync >/dev/null 2>&1; then
            git checkout api-sync
            git reset --hard origin/main
          else
            git checkout -b api-sync
          fi

      - name: Run the deterministic sync patcher
        id: sync
        run: |
          set +e
          swift .api-sync/sync.swift --apply --spec .api-sync/spec-current.json --report /tmp/sync-report.json
          status=$?
          set -e
          echo "=== sync report ==="
          cat /tmp/sync-report.json
          if [ "$status" -ne 0 ]; then
            echo "::error::sync.swift found needs-human drift (see needsHuman above). This cannot be applied automatically; a human must extend spec-map.json/unmodeled.json or make the change by hand."
            exit 1
          fi
          applied=$(jq -r '.appliedCount' /tmp/sync-report.json)
          bump=$(jq -r '.bump' /tmp/sync-report.json)
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Build and test the patched SDK
        if: steps.sync.outputs.applied != '0'
        run: |
          swift build
          swift test
          swift .api-sync/check-contract.swift

      - name: Commit and push
        id: commit
        if: steps.sync.outputs.applied != '0'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SDK_SYNC_PAT }}@github.com/${{ github.repository }}.git"
          git checkout -- .github/workflows/ 2>/dev/null || true
          git add -A
          git reset HEAD .github/workflows/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: sync SDK with API changes"
          git push --force-with-lease origin api-sync

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_PAT }}
        run: |
          EXISTING_PR="${{ steps.check-pr.outputs.existing_pr }}"
          BUMP="${{ steps.sync.outputs.bump }}"

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr comment "$EXISTING_PR" --body "Updated with latest API changes."
            PR_NUMBER="$EXISTING_PR"
          else
            gh pr create \
              --title "feat: sync SDK with API changes" \
              --body "Automated SDK update from API changes (deterministic sync patcher). Bump: $BUMP." \
              --base main \
              --head api-sync \
              --label api-sync
            PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number')
          fi

          gh pr edit "$PR_NUMBER" --add-label release
          if [ "$BUMP" = "minor" ]; then
            gh pr edit "$PR_NUMBER" --add-label minor
          fi

          gh pr merge "$PR_NUMBER" --auto --squash
