name: API Sync

on:
  repository_dispatch:
    types: [api-sync]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    name: Sync SDK with API changes
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch spec-current.json from api-sync-data
        run: |
          git fetch origin api-sync-data
          git show origin/api-sync-data:.api-sync/spec-current.json > /tmp/api-sync-spec-current.json

      - name: Verify delivery manifest
        env:
          PAYLOAD_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          PAYLOAD_SPEC_SHA256: ${{ github.event.client_payload.spec_sha256 }}
          PAYLOAD_GENERATED_AT: ${{ github.event.client_payload.generated_at }}
        run: |
          set -euo pipefail

          if ! git show origin/api-sync-data:.api-sync/delivery.json > /tmp/api-sync-delivery.json 2>/dev/null; then
            echo "::error::api-sync-data branch is missing .api-sync/delivery.json -- refusing to sync against an unverified spec"
            exit 1
          fi
          if [ ! -s /tmp/api-sync-spec-current.json ]; then
            echo "::error::api-sync-data branch is missing or has an empty .api-sync/spec-current.json"
            exit 1
          fi

          echo "=== delivery manifest ==="
          cat /tmp/api-sync-delivery.json

          manifest_repo=$(jq -r '.source_repository // ""' /tmp/api-sync-delivery.json)
          manifest_sha=$(jq -r '.source_sha // ""' /tmp/api-sync-delivery.json)
          manifest_spec_sha256=$(jq -r '.spec_sha256 // ""' /tmp/api-sync-delivery.json)
          manifest_generated_at=$(jq -r '.generated_at // ""' /tmp/api-sync-delivery.json)

          if [ -z "$manifest_repo" ] || [ -z "$manifest_sha" ] || [ -z "$manifest_spec_sha256" ] || [ -z "$manifest_generated_at" ]; then
            echo "::error::delivery.json is missing one or more required fields (source_repository, source_sha, spec_sha256, generated_at)"
            exit 1
          fi
          if [ "$manifest_repo" != "blindpaylabs/blindpay-v2" ]; then
            echo "::error::delivery.json source_repository is \"$manifest_repo\", expected \"blindpaylabs/blindpay-v2\""
            exit 1
          fi

          actual_sha256=$(shasum -a 256 /tmp/api-sync-spec-current.json | cut -d' ' -f1)
          if [ "$actual_sha256" != "$manifest_spec_sha256" ]; then
            echo "::error::spec-current.json sha256 ($actual_sha256) does not match delivery.json's spec_sha256 ($manifest_spec_sha256) -- the fetched spec does not match what was recorded as delivered"
            exit 1
          fi

          if [ -n "${PAYLOAD_SPEC_SHA256:-}" ] && [ "$PAYLOAD_SPEC_SHA256" != "$manifest_spec_sha256" ]; then
            echo "::error::stale delivery: the repository_dispatch client_payload.spec_sha256 ($PAYLOAD_SPEC_SHA256) does not match the manifest currently on api-sync-data ($manifest_spec_sha256). A newer or older delivery has since overwritten the branch; re-trigger the dispatch instead of syncing against a mismatched spec."
            exit 1
          fi

          echo "Delivery manifest verified: source_sha=$manifest_sha spec_sha256=$manifest_spec_sha256 generated_at=$manifest_generated_at"

      - name: Check for existing api-sync PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number // empty')
          echo "existing_pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create or checkout api-sync branch
        run: |
          git fetch origin api-sync 2>/dev/null || true
          if git rev-parse --verify origin/api-sync >/dev/null 2>&1; then
            git checkout api-sync
            git reset --hard origin/main
          else
            git checkout -b api-sync
          fi

      - name: Run the deterministic sync patcher
        id: sync
        run: |
          set +e
          swift .api-sync/sync.swift --apply --spec /tmp/api-sync-spec-current.json --report /tmp/sync-report.json
          status=$?
          set -e
          echo "=== sync report ==="
          cat /tmp/sync-report.json
          if [ "$status" -ne 0 ]; then
            echo "::error::sync.swift found needs-human drift (see needsHuman above). This cannot be applied automatically; a human must extend spec-map.json/unmodeled.json or make the change by hand."
            exit 1
          fi
          applied=$(jq -r '.appliedCount' /tmp/sync-report.json)
          bump=$(jq -r '.bump' /tmp/sync-report.json)
          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Build and test the patched SDK
        if: steps.sync.outputs.applied != '0'
        run: |
          swift build
          swift test
          swift .api-sync/check-contract.swift

      - name: Commit and push
        id: commit
        if: steps.sync.outputs.applied != '0'
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.SDK_SYNC_PAT }}@github.com/${{ github.repository }}.git"
          git checkout -- .github/workflows/ 2>/dev/null || true
          git add -A
          git reset HEAD .github/workflows/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: sync SDK with API changes"
          git push --force-with-lease origin api-sync

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_SYNC_PAT }}
        run: |
          EXISTING_PR="${{ steps.check-pr.outputs.existing_pr }}"
          BUMP="${{ steps.sync.outputs.bump }}"

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR"
            gh pr comment "$EXISTING_PR" --body "Updated with latest API changes."
            PR_NUMBER="$EXISTING_PR"
          else
            gh pr create \
              --title "feat: sync SDK with API changes" \
              --body "Automated SDK update from API changes (deterministic sync patcher). Bump: $BUMP." \
              --base main \
              --head api-sync \
              --label api-sync
            PR_NUMBER=$(gh pr list --head api-sync --json number --jq '.[0].number')
          fi

          gh pr edit "$PR_NUMBER" --add-label release
          if [ "$BUMP" = "minor" ]; then
            gh pr edit "$PR_NUMBER" --add-label minor
          fi

          gh pr merge "$PR_NUMBER" --auto --squash
