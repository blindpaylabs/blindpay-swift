name: Release

# Releases whatever version main declares. BlindPaySDK.version
# (Sources/BlindPay/Core/Version.swift) is the single source of truth:
# merging a PR that changes it tags v<version> and creates the GitHub
# release. Pushes that don't change it find the tag already on the remote
# and do nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: check
        run: .github/scripts/release-check.sh

      - name: Create tag and release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
